apiVersion: v1
kind: Namespace
metadata:
  name: online-exam

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "examuser"
        - name: POSTGRES_PASSWORD
          value: "exampass"
        - name: POSTGRES_DB
          value: "examdb"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: online-exam
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
# RabbitMQ Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: online-exam
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672

---
# Identity Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: sevimbahadiroglu/identity-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://examuser:exampass@postgres:5432/examdb"
        imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: online-exam
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
  - port: 8000
    targetPort: 8000

---
# Exam Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-service
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-service
  template:
    metadata:
      labels:
        app: exam-service
    spec:
      containers:
      - name: exam-service
        image: sevimbahadiroglu/exam-service:latest
        ports:
        - containerPort: 8000   # Uvicorn portu ile eşleşti
        env:
        - name: DATABASE_URL
          value: "postgresql://examuser:exampass@postgres:5432/examdb"
        imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: exam-service
  namespace: online-exam
spec:
  type: ClusterIP
  selector:
    app: exam-service
  ports:
  - port: 8000
    targetPort: 8000

---
# Submit Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submit-service
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submit-service
  template:
    metadata:
      labels:
        app: submit-service
    spec:
      containers:
      - name: submit-service
        image: sevimbahadiroglu/submit-service:latest
        ports:
        - containerPort: 8002
        env:
        - name: DATABASE_URL
          value: "postgresql://examuser:exampass@postgres:5432/examdb"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: submit-service
  namespace: online-exam
spec:
  type: ClusterIP
  selector:
    app: submit-service
  ports:
  - port: 8002
    targetPort: 8002

---
# Grading Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grading-service
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grading-service
  template:
    metadata:
      labels:
        app: grading-service
    spec:
      containers:
      - name: grading-service
        image: sevimbahadiroglu/grading-service:latest
        env:
        - name: DATABASE_URL
          value: "postgresql://examuser:exampass@postgres:5432/examdb"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        imagePullPolicy: IfNotPresent


