# Submit Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submit-service
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submit-service
  template:
    metadata:
      labels:
        app: submit-service
    spec:
      containers:
      - name: submit-service
        image: sevimbahadiroglu/submit-service:latest
        ports:
        - containerPort: 8002
        env:
        - name: DATABASE_URL
          value: "postgresql://examuser:exampass@postgres:5432/examdb"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        imagePullPolicy: IfNotPresent

---
apiVersion: v1
kind: Service
metadata:
  name: submit-service
  namespace: online-exam
spec:
  type: ClusterIP
  selector:
    app: submit-service
  ports:
  - port: 8002
    targetPort: 8002

