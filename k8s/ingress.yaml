apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-exam-ingress
  namespace: online-exam
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: exam.local
    http:
      paths:
      - path: /identity
        pathType: Prefix
        backend:
          service:
            name: identity-service
            port:
              number: 8000
      - path: /exam
        pathType: Prefix
        backend:
          service:
            name: exam-service
            port:
              number: 8000
      - path: /submit
        pathType: Prefix
        backend:
          service:
            name: submit-service
            port:
              number: 8002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
spec:
  rules:
  - host: monitoring.local
    http:
      paths:
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090